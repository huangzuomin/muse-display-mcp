# Mosquitto 配置（评审 D7 安全姿态：无匿名、无公网暴露）
# 安装：sudo cp deploy/mosquitto.conf /etc/mosquitto/conf.d/muse.conf
#       sudo cp deploy/acl /etc/mosquitto/acl && sudo chmod 644 /etc/mosquitto/acl
# 账号：sudo mosquitto_passwd -c /etc/mosquitto/passwd muse    # MCP 服务账号
#       sudo mosquitto_passwd /etc/mosquitto/passwd desk-cube  # 设备账号（交互盲输）
#       sudo systemctl restart mosquitto

# ── 认证（全局，只能声明一次；per_listener_settings 默认 false）────
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# ── 监听 1：仅本机（MCP 服务 → broker）────────────────────────────
listener 1883 127.0.0.1

# ── 监听 2：LAN（HoloCubic 等设备；远程设备走 Tailscale，需求 §13）──
# 绑定 Pi 的 LAN 地址；Pi 无公网 IP，公网不可达
listener 1883 192.0.2.10
